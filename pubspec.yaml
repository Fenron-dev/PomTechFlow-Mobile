name: pomtechflow_mobile
description: IT-Support Pomodoro Zeiterfassung – Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Datenbank (SQLite, lokal auf dem Gerät)
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # PDF Generierung
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4

  # UI Helpers
  flutter_slidable: ^3.1.1
  intl: ^0.19.0
  gap: ^3.0.1
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  archive: ^3.6.1
  app_badge_plus: ^1.0.0

  # Homescreen-Widget
  home_widget: ^0.6.0               # Kommunikation Flutter ↔ nativer Widget

  # Sicherheit
  flutter_secure_storage: ^9.2.2   # Keychain/Keystore für PIN-Hash
  local_auth: ^2.3.0               # Biometrie (Fingerabdruck, Face ID)
  encrypt: ^5.0.3                  # AES-256 für verschlüsselte Exporte
  crypto: ^3.0.6                   # PBKDF2 / HMAC-SHA256 (direkte Abhängigkeit)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
