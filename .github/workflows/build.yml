name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch: # manuell auslösbar

jobs:
  # ─── Android APK ────────────────────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── iOS IPA (nur auf macOS möglich) ────────────────────────────────────────
  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: iOS bauen (ohne Codesigning)
        run: flutter build ios --release --no-codesign

      - name: IPA erstellen
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PomTechFlow.ipa Payload/

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-iOS
          path: PomTechFlow.ipa
          retention-days: 30

  # ─── Release erstellen (nur bei Tags wie v1.0.0) ────────────────────────────
  release:
    name: Release erstellen
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Android APK herunterladen
        uses: actions/download-artifact@v4
        with:
          name: PomTechFlow-Android

      - name: iOS IPA herunterladen
        uses: actions/download-artifact@v4
        with:
          name: PomTechFlow-iOS

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            PomTechFlow.ipa
          generate_release_notes: true
