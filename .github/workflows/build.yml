name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─── Android APK ────────────────────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift + Icons)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons

      - name: APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── iOS IPA ────────────────────────────────────────────────────────────────
  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift + Icons)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run flutter_launcher_icons

      - name: iOS bauen (ohne Codesigning)
        run: flutter build ios --release --no-codesign

      - name: IPA erstellen
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PomTechFlow.ipa Payload/

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-iOS
          path: PomTechFlow.ipa
          retention-days: 30

  # ─── Windows EXE ────────────────────────────────────────────────────────────
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Desktop aktivieren
        run: flutter config --enable-windows-desktop

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Windows bauen
        run: flutter build windows --release

      - name: ZIP erstellen
        run: |
          cd build/windows/x64/runner/Release
          7z a PomTechFlow-Windows.zip *

      - name: Windows Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-Windows
          path: build/windows/x64/runner/Release/PomTechFlow-Windows.zip
          retention-days: 30

  # ─── macOS App ──────────────────────────────────────────────────────────────
  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Desktop aktivieren
        run: flutter config --enable-macos-desktop

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: macOS bauen
        run: flutter build macos --release

      - name: ZIP erstellen
        run: |
          cd build/macos/Build/Products/Release
          zip -r PomTechFlow-macOS.zip *.app

      - name: macOS Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-macOS
          path: build/macos/Build/Products/Release/PomTechFlow-macOS.zip
          retention-days: 30

  # ─── Linux Binary ───────────────────────────────────────────────────────────
  linux:
    name: Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux Abhängigkeiten installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            ninja-build \
            cmake \
            libsecret-1-dev \
            libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Desktop aktivieren
        run: flutter config --enable-linux-desktop

      - name: Dependencies installieren
        run: flutter pub get

      - name: Code generieren (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Linux bauen
        run: flutter build linux --release

      - name: TAR erstellen
        run: |
          cd build/linux/x64/release/bundle
          tar -czf PomTechFlow-Linux.tar.gz *

      - name: Linux Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PomTechFlow-Linux
          path: build/linux/x64/release/bundle/PomTechFlow-Linux.tar.gz
          retention-days: 30

  # ─── Release (bei Tags wie v1.0.0) ──────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Alle Artifacts herunterladen
        uses: actions/download-artifact@v4

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PomTechFlow-Android/app-release.apk
            PomTechFlow-iOS/PomTechFlow.ipa
            PomTechFlow-Windows/PomTechFlow-Windows.zip
            PomTechFlow-macOS/PomTechFlow-macOS.zip
            PomTechFlow-Linux/PomTechFlow-Linux.tar.gz
          generate_release_notes: true
